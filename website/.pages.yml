    {
      "name": "blog",
      "label": "Blog introduction",
      "type": "file",
      "path": "_data/blog.json",
      "format": "json",
      "fields": [
        {
          "name": "eyebrow",
          "type": "string"
        },
        {
          "name": "title",
          "type": "string"
        },
        {
          "name": "intro",
          "label": "Introduction above post cards",
          "type": "text"
        },
        {
          "name": "showExamples",
          "label": "Show example posts in review draft",
          "type": "boolean"
        }
      ]
    },
    {
      "name": "posts",
      "label": "Blog posts",
      "type": "collection",
      "path": "_posts",
      "format": "yaml-frontmatter",
      "filename": "{year}-{month}-{day}-{primary}.md",
      "view": {
        "primary": "title",
        "sort": "date",
        "order": "desc"
      },
      "fields": [
        {
          "name": "title",
          "type": "string",
          "required": true
        },
        {
          "name": "date",
          "type": "date",
          "required": true
        },
        {
          "name": "description",
          "label": "Short summary for the card",
          "type": "text"
        },
        {
          "name": "category",
          "label": "Topic",
          "type": "string"
        },
        {
          "name": "published",
          "label": "Publish this post",
          "type": "boolean"
        },
        {
          "name": "example",
          "label": "This is a layout example",
          "type": "boolean"
        },
        {
          "name": "body",
          "type": "rich-text"
        }
      ]
    },
    {
      "name": "references",
      "label": "References",
      "type": "file",
      "path": "_data/references.json",
      "format": "json",
      "list": true,
      "fields": [
        {
          "name": "name",
          "label": "Full name",
          "type": "string",
          "required": true
        },
        {
          "name": "role",
          "label": "Title or role",
          "type": "string",
          "required": false
        },
        {
          "name": "department",
          "label": "Department",
          "type": "string",
          "required": false
        },
        {
          "name": "institution",
          "label": "Institution or organization",
          "type": "string",
          "required": false
        },
        {
          "name": "photo",
          "label": "Photo (optional)",
          "type": "image",
          "required": false
        },
        {
          "name": "phone",
          "label": "Phone number (optional)",
          "type": "string",
          "required": false
        },
        {
          "name": "email",
          "label": "Email address (optional)",
          "type": "string",
          "required": false
        }
      ]
    },
    {
      "name": "references_settings",
      "label": "References page settings",
      "type": "file",
      "path": "_data/reference_settings.json",
      "format": "json",
      "fields": [
        {
          "name": "intro",
          "label": "Introduction",
          "type": "text"
        },
        {
          "name": "showExample",
          "label": "Show example card when no references exist",
          "type": "boolean"
        }
      ]
    },
    {
      "name": "publications",
      "label": "Publications",
      "type": "file",
      "path": "_data/publications.json",
      "format": "json",
      "list": true,
      "fields": [
        {
          "name": "title",
          "type": "string",
          "required": true
        },
        {
          "name": "status",
          "type": "select",
          "options": {
            "values": [
              "in-progress",
              "published"
            ]
          },
          "required": true
        },
        {
          "name": "date",
          "label": "Publication or manuscript date (YYYY-MM-DD; optional)",
          "type": "string"
        },
        {
          "name": "authors",
          "type": "string"
        },
        {
          "name": "venue",
          "label": "Journal or venue",
          "type": "string"
        },
        {
          "name": "summary",
          "type": "text"
        },
        {
          "name": "url",
          "label": "DOI, article or preprint URL",
          "type": "string"
        }
      ]
    }
