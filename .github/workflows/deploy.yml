name: Deploy site
on:
  push:
    branches: [main]
    paths: ['website/**', 'CNAME', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: website-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: website
        run: npm ci --ignore-scripts
      - name: Build website
        working-directory: website
        run: npm run build
      - name: Preserve custom domain
        run: |
          cp CNAME website/dist/CNAME
          git rev-parse HEAD > website/dist/deployment.txt
      - name: Publish to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: website/dist
