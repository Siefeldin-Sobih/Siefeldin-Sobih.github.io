<svg xmlns="http://www.w3.org/2000/svg" width="400" height="460" viewBox="0 0 400 460" role="img" aria-labelledby="title"><title id="title">Factoring a quadratic</title><rect width="400" height="460" rx="16" fill="#596951"/><g fill="#f1f0e6" font-family="Georgia,serif"><text x="34" y="56" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">COLLEGE ALGEBRA</text><text x="34" y="145" font-size="32">x² − 5x + 6 = 0</text><path d="M34 179H366" stroke="#d1d6c4" opacity=".35"/><text x="34" y="243" font-size="29">(x − 2)(x − 3) = 0</text><text x="34" y="322" font-size="35">x = 2 or 3</text><text x="34" y="412" font-family="Arial,sans-serif" font-size="13" fill="#d1d6c4">Factor. Solve. Check.</text></g></svg>